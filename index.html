<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>Kostenkalkulation - Training</title>
    <link rel="icon" type="image/x-icon" href="fav.ico">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="topbar" id="topbar">
        <div class="topbar-left">
            <div class="topbar-title">Kostenkalkulation - Training</div>
        </div>
        <div class="topbar-right">
            <div class="topbar-actions">
                <button id="btnNeuesProjekt">Neues Projekt starten</button>

                <label for="jsonLoader" class="file-upload header-btn">Projekt laden</label>
                <input type="file" id="jsonLoader" accept="application/json"/>

                <button id="btnSaveProject" class="btnGrey" disabled>Projekt speichern</button>
                <button id="btnExportAll" class="btnGrey" style="display:none;">Kosten und Trainingsplan exportieren</button>
            </div>
        </div>
    </header>

    <!-- Overlay für Dialog -->
    <div id="overlay">
        <div id="dialog"></div>
    </div>

    <!-- Hauptcontainer -->
    <div id="app"></div>

    <!-- Daten: Feiertage + Ferien -->
    <script src="de_daten.js"></script>

    <!-- XLSX-Export -->
    <script src="https://cdn.jsdelivr.net/npm/xlsx-js-style@1.2.0/dist/xlsx.bundle.js"></script>

    <!-- App -->
    <script src="app.js"></script>

</body>
</html>
